<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Arquivo de CSS externo -->
</head>
<body>
    <div class="logo">
        <img src="img/Logo.png" alt="Logo">
    </div>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">

        <!-- Formulário de Cadastro -->
        <div class="signup">
            <form id="formCadastro">
                <label for="chk" aria-hidden="true">Cadastrar</label>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <input type="text" id="nomeUsuario" name="nomeUsuario" placeholder="Nome de usuário" required>
                <input type="password" id="senha" name="senha" placeholder="Senha" required>
                <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirmar senha" required>
                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <!-- Formulário de Login -->
        <div class="login">
            <form id="formLogin">
                <label for="chk" aria-hidden="true">Entrar</label>
                <input type="email" id="emailLogin" placeholder="Email" required>
                <input type="password" id="senhaLogin" placeholder="Senha" required>
                <button type="submit" id="btnLogin">Entrar</button>
            </form>
            <div class="reset-container">
                <a href="senha.html" class="reset-link">Esqueci minha senha</a>
            </div>
            
        </div>
    </div>


    

    <!-- Importação dos Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/firebase-auth.js"></script>
    <script type="module">
        import { salvarUsuario } from "./js/firebase-config.js";
        import { autenticarUsuario } from "./js/firebase-auth.js";

        // Evento de cadastro
        document.getElementById("formCadastro").addEventListener("submit", async function (event) {
            event.preventDefault();

            const nomeCompleto = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const nomeUsuario = document.getElementById("nomeUsuario").value.trim();
            const senha = document.getElementById("senha").value.trim();
            const confirmarSenha = document.getElementById("confirmarSenha").value.trim();

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                await salvarUsuario(nomeCompleto, email, nomeUsuario, senha);
            } catch (error) {
                console.error("Erro ao salvar os dados:", error);
            }
        });

        // Evento de login
        document.getElementById("btnLogin").addEventListener("click", async function (event) {
            event.preventDefault();

            const email = document.getElementById("emailLogin").value.trim();
            const senha = document.getElementById("senhaLogin").value.trim();

            if (!email || !senha) {
                alert("Por favor, preencha todos os campos!");
                return;
            }

            try {
                await autenticarUsuario(email, senha);
            } catch (error) {
                console.error("Erro ao autenticar usuário:", error.message);
                alert("Erro ao autenticar usuário.");
            }
        });
    </script>

<script type="module" src="perfil.js"></script>

</body>
</html>
