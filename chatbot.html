<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisBot</title>
    <link rel="stylesheet" href="chatbot_styles.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-left">
                <img src="img/robo_logo.png" alt="JurisBot Logo" class="bot-logo" />
                <h1>JurisBot</h1>
            </div>
            <div class="header-right">
                <button id="menuToggle" class="menu-button">⋮</button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <button class="menu-item">Reiniciar conversa</button>
                    <button class="menu-item">Voltar para Início</button>
                    <a href="suporte.html" class="menu-item">Suporte</a>
                </div>
            </div>
        </header>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Digite aqui o que precisa...">
            <button id="sendMessage">Enviar</button>
        </div>
    </div>
    <script src="js/robo.js"></script>
    <script src="js/chatbot_script.js"></script>
</body>
</html>
