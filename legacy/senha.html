<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!-- Formulário de Reset de Senha -->
<div class="reset-password">
    <form id="formResetSenha">
        <label for="emailReset" aria-hidden="true">Redefinir Senha</label>
        <input type="email" id="emailReset" name="emailReset" placeholder="Digite seu email" required>
        <button type="submit">Enviar E-mail de Redefinição</button>
    </form>
</div>

</body>
</html>
